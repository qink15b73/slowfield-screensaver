[package]
name = "ulam-screensaver"
version = "0.1.0"
edition = "2024"
description = "A Rust-first Windows Ulam spiral screensaver"
license = "MIT"

[[bin]]
name = "ulam"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Media",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
